[workspace]
resolver = "2"
members = ["crates/bridge", "crates/cef-host", "crates/import", "crates/perf", "crates/shell", "crates/storage", "crates/update", "crates/extensions", "crates/installer", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Ambiqa"]

[workspace.dependencies]
# CEF 158 (Chromium 158.0.8127.89). cef-rs hasn't released its 158 bindings to crates.io
# yet, so this pins the commit its own bot generated them in. Move back to a crates.io
# version once one for 158 is out.
cef = { git = "https://github.com/tauri-apps/cef-rs", rev = "b3ff2019e53333a8e542642fed415d3e511ecd1b", default-features = false }

[profile.release]
lto = "thin"
strip = true
