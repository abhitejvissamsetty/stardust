[workspace]
resolver = "2"
members = ["crates/bridge", "crates/cef-host", "crates/import", "crates/perf", "crates/shell", "crates/storage", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
cef = { version = "=156.2.0", default-features = false }

[profile.release]
lto = "thin"
strip = true
