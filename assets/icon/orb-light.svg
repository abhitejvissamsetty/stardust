<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 320 320" width="320" height="320">
<!-- The welcome page's orb, still: made from ui/welcome.html for the installer. Render with rsvg-convert. -->
<defs>
                <radialGradient id="glass" cx="42%" cy="36%" r="64%">
                  <stop offset="0" stop-color="#ffffff" />
                  <stop offset="0.7" stop-color="#f7f7fb" />
                  <stop offset="1" stop-color="#e4e6f1" />
                </radialGradient>
                <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ffffff" />
                  <stop offset="0.5" stop-color="#c9cdda" />
                  <stop offset="1" stop-color="#eef0f6" />
                </linearGradient>
                <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#2f6fed" stop-opacity="0.35" />
                  <stop offset="0.35" stop-color="#2f6fed" />
                  <stop offset="0.65" stop-color="#8b5cf6" />
                  <stop offset="1" stop-color="#d6479a" stop-opacity="0.85" />
                </linearGradient>
                <linearGradient id="starfill" x1="0.15" y1="0" x2="0.85" y2="1">
                  <stop offset="0" stop-color="#2f6fed" />
                  <stop offset="0.55" stop-color="#8b5cf6" />
                  <stop offset="1" stop-color="#d6479a" />
                </linearGradient>
                <radialGradient id="core" cx="50%" cy="50%" r="50%">
                  <stop offset="0" stop-color="#c9d7ff" stop-opacity="0.95" />
                  <stop offset="0.45" stop-color="#e3d9ff" stop-opacity="0.5" />
                  <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
                </radialGradient>
                <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" /></filter>
                <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" /></filter>
                <filter id="shade" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="8" /></filter>
                <clipPath id="front"><rect x="0" y="150" width="300" height="150" /></clipPath>
              </defs>
              <ellipse cx="150" cy="292" rx="92" ry="9" fill="#2a2f5a" opacity="0.14" filter="url(#shade)" />
              <circle cx="150" cy="150" r="128" fill="url(#glass)" />
              <circle cx="150" cy="150" r="127.5" fill="none" stroke="url(#rim)" stroke-width="1.4" />
              <path d="M58 92 A128 128 0 0 1 150 22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#soft)" />
<g transform="rotate(-19 150 150)"><!-- back half of the ribbon, behind the star -->
              <ellipse cx="150" cy="150" rx="118" ry="44" fill="none" stroke="url(#band)" stroke-width="9" stroke-opacity="0.3" /></g>
<circle cx="150" cy="150" r="70" fill="url(#core)" filter="url(#bloom)" />
              <path d="M150 50 C153 120 160 147 222 150 C160 153 153 180 150 250 C147 180 140 153 78 150 C140 147 147 120 150 50Z" fill="url(#starfill)" />
              <circle cx="150" cy="150" r="4" fill="#ffffff" filter="url(#soft)" />
<g transform="rotate(-19 150 150)"><g clip-path="url(#front)">
                <ellipse cx="150" cy="150" rx="118" ry="44" fill="none" stroke="url(#band)" stroke-width="9" />
                <ellipse cx="150" cy="150" rx="118" ry="44" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1" transform="translate(0 -3.5)" />
              </g></g>
<g transform="rotate(232 150 150)"><circle cx="150" cy="14" r="2.2" fill="#d6479a" /><circle cx="150" cy="14" r="6" fill="#d6479a" opacity="0.25" filter="url(#soft)" /></g>
</svg>
