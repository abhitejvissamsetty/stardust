[package]
name = "cef-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["sandbox", "bundled-sqlite"]
bundled-sqlite = ["storage/bundled"]
sandbox = ["cef/sandbox"]

[dependencies]
bridge = { path = "../bridge" }
cef.workspace = true
extensions = { path = "../extensions" }
import = { path = "../import" }
update = { path = "../update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storage = { path = "../storage", default-features = false }
base64 = "0.22"
directories = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSResponder"] }
