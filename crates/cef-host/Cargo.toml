[package]
name = "cef-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sandbox", "bundled-sqlite"]
bundled-sqlite = ["storage/bundled"]
sandbox = ["cef/sandbox"]

[dependencies]
bridge = { path = "../bridge" }
cef.workspace = true
import = { path = "../import" }
serde_json = "1"
storage = { path = "../storage", default-features = false }
directories = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSResponder"] }
