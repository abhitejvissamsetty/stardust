[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["bundled"]
# Compiles SQLite into the browser, so users don't need it installed.
bundled = ["rusqlite/bundled"]

[dependencies]
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
