[package]
name = "shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# On Windows, CEF's sandbox requires the app to be a DLL that bootstrap.exe loads,
# and the DLL must share the executable's name.
[lib]
name = "stardust"
crate-type = ["cdylib"]

[[bin]]
name = "stardust"
path = "src/main.rs"

[[bin]]
name = "stardust_helper"
path = "src/bin/helper.rs"

[features]
default = ["sandbox"]
sandbox = ["cef-host/sandbox"]

[package.metadata.cef.bundle]
helper_name = "stardust_helper"

[dependencies]
cef-host = { path = "../cef-host", default-features = false, features = ["bundled-sqlite"] }

[target.'cfg(target_os = "windows")'.dependencies]
cef.workspace = true
