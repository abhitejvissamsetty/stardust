name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Two CEF builds fill the Linux runner's disk. Debug info is the
      # biggest part of the debug build and isn't needed here.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libglib2.0-dev libdbus-1-dev pkg-config
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask bundle --release
      # The Windows and Linux builds, to download from the run's page and try.
      - name: Keep the build
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: stardust-${{ runner.os }}
          path: dist
          retention-days: 14
          if-no-files-found: error
      - name: Check performance budgets
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -yq xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0
          xvfb-run -a cargo run --release -p perf -- dist
