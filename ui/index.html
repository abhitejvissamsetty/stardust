<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Toolbar</title>
    <style>
      /*TOKENS*/
      /*TOOLBAR*/
    </style>
  </head>
  <body>
    <div class="tab-row">
      <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>
      <button class="icon-button" id="new-tab" title="New tab" aria-label="New tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <div class="tab-row-space"></div>
      <div class="private-badge" id="private-badge" title="Nothing you do in this window is saved" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12h18M6 12l1.5-6h9L18 12" /><circle cx="8" cy="16.5" r="2.5" /><circle cx="16" cy="16.5" r="2.5" /><path d="M10.5 16.5h3" />
        </svg>
        <span>Private</span>
      </div>
    </div>
    <nav class="toolbar" aria-label="Browser controls">
      <button class="icon-button" id="back" title="Back" aria-label="Back" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
      </button>
      <button class="icon-button" id="forward" title="Forward" aria-label="Forward" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </button>
      <button class="icon-button" id="reload" title="Reload" aria-label="Reload">
        <svg id="reload-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" />
        </svg>
        <svg id="stop-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <form class="address" id="address-form" role="search">
        <span class="site-info" id="site-info" hidden>
          <svg id="lock-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <rect x="5" y="11" width="14" height="9" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
          </svg>
          <svg id="warn-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M12 4l9 16H3z" /><path d="M12 10v4M12 17h.01" />
          </svg>
          <span id="site-info-label"></span>
        </span>
        <input
          id="address"
          type="text"
          aria-label="Address and search"
          placeholder="Search or enter address"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button class="zoom-chip" id="zoom-chip" type="button" title="Reset zoom" aria-label="Reset zoom" hidden></button>
        <button class="icon-button small" id="fill-login" type="button" title="Fill saved login" aria-label="Fill saved login" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="8" cy="15" r="4" />
            <path d="M11 12l8-8M16 7l3 3M14 9l2 2" />
          </svg>
        </button>
        <button class="icon-button small star" id="star" type="button" title="Bookmark this page" aria-label="Bookmark this page" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4l2.5 5.2 5.7.8-4.1 4 1 5.7L12 17l-5.1 2.7 1-5.7-4.1-4 5.7-.8z" />
          </svg>
        </button>
      </form>
      <div class="toolbar-end">
        <span class="toast" id="toast" role="status" hidden></span>
        <button class="workspace-button" id="workspace-button" type="button" title="Workspaces" aria-label="Workspaces" aria-haspopup="menu">
          <span class="ws-dot" id="ws-dot" data-color="blue"></span>
          <span class="ws-name" id="ws-name">Personal</span>
        </button>
        <button class="icon-button" id="side-panel-button" type="button" title="Side panel: notes, to-dos and snippets" aria-label="Side panel" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2" /><path d="M14.5 5v14" /></svg>
        </button>
        <div class="pinned" id="pinned-extensions"></div>
        <button class="icon-button" id="extensions-button" title="Extensions" aria-label="Extensions" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h4v3a2 2 0 1 0 4 0h0v4h-3a2 2 0 1 0 0 4h3v4h-4a2 2 0 1 0-4 0H6v-4a2 2 0 1 0 0-4V7a4 4 0 0 1 4-4z" /></svg>
        </button>
        <button class="icon-button" id="menu-button" title="Stardust menu" aria-label="Stardust menu" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="12" cy="19" r="1.2" /></svg>
        </button>
      </div>
      <div class="progress" id="progress"></div>
    </nav>
    <section class="dialog" id="dialog" role="alertdialog" aria-labelledby="dialog-message" hidden>
      <div class="dialog-text">
        <span class="dialog-origin" id="dialog-origin"></span>
        <span class="dialog-message" id="dialog-message"></span>
      </div>
      <input id="dialog-input" type="text" aria-label="Your answer" autocomplete="off" hidden />
      <button class="text-button" id="dialog-cancel">Cancel</button>
      <button class="text-button primary" id="dialog-ok">OK</button>
    </section>
    <nav class="bookmarks-bar" id="bookmarks-bar" aria-label="Bookmarks bar" hidden></nav>
    <section class="find" id="find" aria-label="Find in page" hidden>
      <input id="find-input" type="text" placeholder="Find in page" aria-label="Find in page" autocomplete="off" spellcheck="false" />
      <span class="find-count" id="find-count" role="status"></span>
      <button class="icon-button match-case" id="find-match-case" title="Match case" aria-label="Match case" aria-pressed="false">Aa</button>
      <button class="icon-button" id="find-previous" title="Previous match" aria-label="Previous match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
      </button>
      <button class="icon-button" id="find-next" title="Next match" aria-label="Next match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
      </button>
      <button class="icon-button" id="find-close" title="Close find bar" aria-label="Close find bar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </section>
    <section class="downloads" id="downloads" aria-label="Downloads" hidden>
      <div class="download-list" id="download-list"></div>
      <div class="close-warning" id="close-warning" role="alert" hidden>
        <span id="close-warning-text"></span>
        <button class="text-button" id="keep-downloading">Keep downloading</button>
        <button class="text-button danger" id="close-anyway">Close anyway</button>
      </div>
      <button class="text-button" id="clear-downloads">Clear</button>
    </section>
    <script>
      /*APP*/
    </script>
  </body>
</html>
