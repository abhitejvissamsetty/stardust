<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Side panel</title>
    <style>
      /*TOKENS*/
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        background: var(--surface);
        border-left: 1px solid var(--divider);
        color: var(--text);
        display: flex;
        flex-direction: column;
        font: var(--text-sm) var(--font-ui);
      }
      button, input, textarea { font: inherit; }
      svg { fill: none; flex: none; height: 16px; stroke: currentcolor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.75; width: 16px; }
      header { align-items: center; border-bottom: 1px solid var(--divider); display: flex; gap: var(--space-1); padding: var(--space-2); }
      .tabs { display: flex; flex: 1; gap: var(--space-1); }
      .tab {
        background: transparent; border: 0; border-radius: 6px; color: var(--text-muted);
        cursor: default; font-size: 12.5px; height: 30px; padding: 0 5px; white-space: nowrap;
      }
      .tab:hover { background: var(--hover); color: var(--text); }
      .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      .icon {
        align-items: center; background: transparent; border: 0; border-radius: 6px; color: var(--text-muted);
        cursor: default; display: flex; flex: none; height: 28px; justify-content: center; padding: 0; width: 28px;
      }
      .icon:hover { background: var(--hover); color: var(--text); }
      section { display: flex; flex: 1; flex-direction: column; gap: var(--space-2); min-height: 0; padding: var(--space-3); }
      section[hidden] { display: none; }
      .status { color: var(--text-muted); font-size: 12px; min-height: 16px; }
      textarea, input[type="text"] {
        background: var(--field); border: 1px solid transparent; border-radius: 6px; color: var(--text);
        outline: none; padding: 8px 10px; width: 100%;
      }
      textarea:focus, input[type="text"]:focus { background: var(--field-focus); border-color: var(--accent); }
      #notes { flex: 1; line-height: 1.45; resize: none; }
      .row { align-items: center; display: flex; gap: var(--space-2); }
      .primary, .quiet {
        border: 0; border-radius: 6px; cursor: default; flex: none; height: 30px; padding: 0 var(--space-3);
      }
      .primary { background: var(--accent); color: var(--on-accent); }
      .quiet { background: var(--field); color: var(--text); }
      .quiet:hover { background: var(--press); }
      .list { flex: 1; overflow-y: auto; }
      .item { align-items: center; border-radius: 6px; display: flex; gap: var(--space-2); min-height: 34px; padding: 4px var(--space-2); }
      .item:hover { background: var(--hover); }
      .item .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .item.done .text { color: var(--text-muted); text-decoration: line-through; }
      .item .actions { display: flex; gap: 2px; }
      .snippet { align-items: flex-start; flex-direction: column; gap: 2px; }
      .snippet .head { align-items: center; display: flex; gap: var(--space-2); width: 100%; }
      .snippet .title { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .snippet .body { color: var(--text-muted); max-height: 3.6em; overflow: hidden; overflow-wrap: anywhere; white-space: pre-wrap; width: 100%; }
      .link { background: transparent; border: 0; color: var(--accent); cursor: default; padding: 0; text-align: left; }
      .link:hover { text-decoration: underline; }
      .snippet .note { border-left: 2px solid var(--divider); padding-left: 8px; }
      .swatches { display: grid; flex: 1; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); align-content: start; overflow-y: auto; }
      .chip { position: relative; text-align: center; }
      .swatch { border: 1px solid var(--divider); border-radius: 8px; cursor: default; height: 48px; padding: 0; width: 100%; }
      .chip .hex { color: var(--text-muted); display: block; font: 11px ui-monospace, Menlo, monospace; padding-top: 3px; }
      .chip-x { background: var(--surface); border: 1px solid var(--divider); border-radius: 50%; display: none; height: 18px; position: absolute; right: -4px; top: -4px; width: 18px; font-size: 12px; }
      .chip:hover .chip-x { display: flex; }
      .empty { color: var(--text-muted); padding: var(--space-3) var(--space-2); }
      input[type="checkbox"] { accent-color: var(--accent); flex: none; height: 16px; margin: 0; width: 16px; }
    </style>
  </head>
  <body>
    <header>
      <div class="tabs" role="tablist" aria-label="Side panel">
        <button class="tab" role="tab" data-tab="clips" aria-selected="false">Clips</button>
        <button class="tab" role="tab" data-tab="colors" aria-selected="false">Colours</button>
      </div>
      <button class="icon" id="close" title="Close the side panel" aria-label="Close the side panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
      </button>
    </header>

    <section id="clips-section" role="tabpanel" hidden>
      <div class="row">
        <button class="primary" id="clip-page" type="button">Clip this page</button>
        <button class="quiet" id="open-library" type="button">Open library</button>
        <button class="quiet" id="copy-clips" type="button">Copy all as Markdown</button>
      </div>
      <div class="list" id="clip-list"></div>
      <div class="status" id="clip-status" role="status"></div>
    </section>

    <section id="colors-section" role="tabpanel" hidden>
      <div class="row">
        <button class="primary" id="pick-colour" type="button">Pick from the page</button>
        <button class="quiet" id="inspect-text" type="button">Identify text</button>
      </div>
      <div class="swatches" id="swatch-list"></div>
      <div class="row"><span class="status" id="colors-status" style="flex:1" role="status"></span><button class="quiet" id="copy-colors" type="button">Copy all</button></div>
    </section>

    <script>
      "use strict";
      const send = (command) => window.browserBridge.send(JSON.stringify(command));
      const byId = (id) => document.getElementById(id);
      const make = (tag, className, text) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };

      let data = { notes: "", todos: [], snippets: [], clips: [], colors: [] };
      let saveTimer = null;
      let statusTimer = null;

      // Tabs ---------------------------------------------------------------------
      function showTab(name) {
        for (const tab of document.querySelectorAll(".tab")) {
          tab.setAttribute("aria-selected", String(tab.dataset.tab === name));
        }
        for (const id of ["clips", "colors"]) {
          byId(`${id}-section`).hidden = id !== name;
        }
        try { sessionStorage.setItem("tab", name); } catch (_) {}
      }
      for (const tab of document.querySelectorAll(".tab")) {
        tab.addEventListener("click", () => showTab(tab.dataset.tab));
      }
      byId("close").addEventListener("click", () => send({ type: "toggleSidePanel" }));

      function flash(id, text) {
        const element = byId(id);
        element.textContent = text;
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => (element.textContent = ""), 1800);
      }

      // Snippets -----------------------------------------------------------------
      // The text is copied with a hidden field, since a page of this kind can't use the
      // clipboard's own API.
      function copy(text, statusId = "clip-status") {
        const field = make("textarea");
        field.value = text;
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.append(field);
        field.select();
        let copied = false;
        try { copied = document.execCommand("copy"); } catch (_) {}
        field.remove();
        flash(statusId, copied ? "Copied" : "Couldn't copy");
      }
      // Clips -------------------------------------------------------------------
      function host(url) {
        try { return new URL(url).hostname.replace(/^www\./, ""); } catch (_) { return ""; }
      }
      function renderClips() {
        const list = byId("clip-list");
        byId("copy-clips").hidden = data.clips.length === 0;
        if (data.clips.length === 0) {
          list.replaceChildren(make("div", "empty", "Nothing clipped yet. Select some text and press Clip this page, or just clip the page."));
          return;
        }
        list.replaceChildren(...data.clips.map((clip) => {
          const row = make("div", "item snippet");
          const head = make("div", "head");
          const open = make("button", "title link", clip.title);
          open.title = clip.url;
          open.addEventListener("click", () => send({ type: "openClip", id: clip.id }));
          const copyLink = make("button", "quiet", "Copy link");
          copyLink.addEventListener("click", () => copy(clip.url, "clip-status"));
          const remove = make("button", "icon", "×");
          remove.title = "Remove";
          remove.setAttribute("aria-label", "Remove");
          remove.addEventListener("click", () => send({ type: "removeClip", id: clip.id }));
          head.append(open, copyLink, remove);
          const when = new Date(clip.saved_ms).toLocaleDateString();
          row.append(head, make("div", "body", `${host(clip.url)} · ${when}`));
          if (clip.note) {
            row.append(make("div", "body note", clip.note));
          }
          return row;
        }));
      }
      // Markdown is plain text, so clips can be pasted into notes, documents or a repository.
      function markdown() {
        const escape = (text) => text.replace(/([\[\]\\])/g, "\\$1");
        return data.clips
          .map((clip) => {
            const quote = clip.note ? "\n\n" + clip.note.split("\n").map((line) => `> ${line}`).join("\n") : "";
            return `## [${escape(clip.title)}](${clip.url})${quote}`;
          })
          .join("\n\n");
      }
      byId("clip-page").addEventListener("click", () => send({ type: "clipPage" }));
      byId("open-library").addEventListener("click", () => send({ type: "openLibrary" }));
      byId("copy-clips").addEventListener("click", () => copy(markdown(), "clip-status"));

      // Colours -----------------------------------------------------------------
      function renderColours() {
        const list = byId("swatch-list");
        byId("copy-colors").hidden = data.colors.length === 0;
        if (data.colors.length === 0) {
          list.replaceChildren(make("div", "empty", "No colours yet. Pick one from the page and it's kept here."));
          return;
        }
        list.replaceChildren(...data.colors.map((hex) => {
          const chip = make("div", "chip");
          const swatch = make("button", "swatch");
          swatch.style.background = hex;
          swatch.title = `${hex}. Click to copy`;
          swatch.setAttribute("aria-label", `Copy ${hex}`);
          swatch.addEventListener("click", () => copy(hex, "colors-status"));
          const remove = make("button", "icon chip-x", "×");
          remove.title = "Remove";
          remove.setAttribute("aria-label", `Remove ${hex}`);
          remove.addEventListener("click", () => send({ type: "removeColor", hex }));
          chip.append(swatch, remove, make("span", "hex", hex));
          return chip;
        }));
      }
      byId("pick-colour").addEventListener("click", () => send({ type: "pickColor" }));
      byId("inspect-text").addEventListener("click", () => send({ type: "inspectText" }));
      byId("copy-colors").addEventListener("click", () => copy(data.colors.join("\n"), "colors-status"));

      // What the browser sends: the clips and colours, for every window to share.
      window.onBrowserEvent = (event) => {
        if (event.type !== "panelData") {
          return;
        }
        data = event.data;
        renderClips();
        renderColours();
      };

      try { showTab(["clips", "colors"].includes(sessionStorage.getItem("tab")) ? sessionStorage.getItem("tab") : "clips"); } catch (_) { showTab("clips"); }
      send({ type: "sidePanelReady" });
    </script>
  </body>
</html>
