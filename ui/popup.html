<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Menu</title>
    <style>
      /*TOKENS*/
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        background: var(--surface);
        border: 1px solid var(--divider);
        border-radius: var(--radius-sm);
        color: var(--text);
        font: var(--text-sm) var(--font-ui);
        padding: var(--space-1);
        user-select: none;
      }
      .item {
        align-items: center;
        border-radius: 6px;
        display: flex;
        gap: var(--space-3);
        height: 36px;
        padding: 0 var(--space-3);
      }
      .item:hover, .item.selected { background: var(--press); }
      .title, .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .title { flex: 0 1 auto; max-width: 60%; }
      .url { color: var(--text-muted); flex: 1; min-width: 0; }
      .mark { color: var(--accent); flex: none; }
    </style>
  </head>
  <body>
    <div id="items" role="listbox"></div>
    <script>
      /*SCRIPT*/
    </script>
  </body>
</html>
